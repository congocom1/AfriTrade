name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck, and build
  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Check maintained documentation links
        run: npm run docs:check

      - name: Check visual asset registry
        run: npm run assets:check

      - name: Check high/critical dependency vulnerabilities
        run: npm run security:check

      - name: Run Node tests
        run: npm test

      - name: Run frontend build
        run: npm run build

  route-switching:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Test route switching without a live backend
        run: npx playwright test test/e2e/route-switching.spec.js --project=chromium --project=mobile-chrome --project=mobile-webkit
        env:
          E2E_MOCK_API: '1'
          CI: 'true'

  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Flutter sources
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        run: flutter test --no-pub --reporter expanded

  # Read-only browser smoke tests against an explicitly configured staging app.
  staging-smoke:
    runs-on: ubuntu-latest
    needs: [frontend-checks]
    if: github.event_name == 'pull_request' && vars.STAGING_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Run public smoke and anonymous route guards (desktop, Android-like, iOS-like)
        run: npx playwright test test/e2e/smoke.spec.js test/e2e/route-guards.spec.js --project=chromium --project=mobile-chrome --project=mobile-webkit
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
          CI: 'true'
      - name: Run responsive layout and deployment parity checks
        run: npx playwright test test/e2e/public-responsive.spec.js test/e2e/deployment-parity.spec.js --project=chromium
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
          CI: 'true' 
