<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc"><title id="title">Illustrative China to DR Congo supply-chain stages</title><desc id="desc">Supplier, China warehouse, international freight, DR Congo customs, DR Congo warehouse, and final delivery. Not a map or transport schedule.</desc><rect width="1440" height="520" rx="32" fill="#0F1714"/><path d="M135 252H1305" stroke="#3B6653" stroke-width="8" stroke-dasharray="18 14"/><g font-family="sans-serif" font-size="22" text-anchor="middle" fill="#EDF2EE"><circle cx="145" cy="252" r="43" fill="#12A87A"/><text x="145" y="260" fill="#091611" font-weight="bold">1</text><text x="145" y="340">Supplier</text><circle cx="374" cy="252" r="43" fill="#12A87A"/><text x="374" y="260" fill="#091611" font-weight="bold">2</text><text x="374" y="340">China hub</text><circle cx="603" cy="252" r="43" fill="#12A87A"/><text x="603" y="260" fill="#091611" font-weight="bold">3</text><text x="603" y="340">Freight</text><circle cx="832" cy="252" r="43" fill="#12A87A"/><text x="832" y="260" fill="#091611" font-weight="bold">4</text><text x="832" y="340">DRC customs</text><circle cx="1061" cy="252" r="43" fill="#12A87A"/><text x="1061" y="260" fill="#091611" font-weight="bold">5</text><text x="1061" y="340">DRC hub</text><circle cx="1290" cy="252" r="43" fill="#12A87A"/><text x="1290" y="260" fill="#091611" font-weight="bold">6</text><text x="1290" y="340">Delivery</text></g></svg>