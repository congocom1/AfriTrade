name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Lint, typecheck, and build
  frontend-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22.12.0', '24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run Node tests
        run: npm test

      - name: Run frontend build
        run: npm run build

  # Read-only browser smoke tests against an explicitly configured staging app.
  staging-smoke:
    runs-on: ubuntu-latest
    needs: [frontend-checks]
    if: github.event_name == 'pull_request' && vars.STAGING_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run public staging smoke tests
        run: npx playwright test test/e2e/smoke.spec.js
        env:
          BASE_URL: ${{ vars.STAGING_BASE_URL }}
