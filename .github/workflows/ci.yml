name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Lint, typecheck, and build
  frontend-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run Node tests
        run: npm test

      - name: Run frontend build
        run: npm run build

  # Optional staging smoke test
  staging-smoke:
    runs-on: ubuntu-latest
    needs: [frontend-checks]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start web server
        run: npm run dev &
        timeout-minutes: 5

      - name: Wait for server to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5173 > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 10
          done
          echo "Server failed to start"
          exit 1
        timeout-minutes: 10

      - name: Run Playwright smoke tests
        run: npm run test:e2e:ci
        env:
          BASE_URL: http://localhost:5173

      - name: Kill web server
        if: always()
        run: pkill -f "vite"