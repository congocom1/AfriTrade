name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main, cto-hardening]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'assets/**'
      - 'test/**'
      - 'third_party/**'
      - 'pubspec.*'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'assets/**'
      - 'test/**'
      - 'third_party/**'
      - 'pubspec.*'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Toolchain versions
        run: |
          xcodebuild -version
          flutter --version
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze
      - name: Flutter tests
        run: flutter test
      - name: Build simulator app
        run: flutter build ios --simulator --debug
      - name: Build device app (unsigned)
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-${{ github.sha }}
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
